# Template for the Secret that carries a LOCALLY-managed tunnel's credentials:
# the JSON that `cloudflared tunnel create` writes to ~/.cloudflared/<UUID>.json.
#
# Easiest: build the Secret straight from that file and never touch this one:
#   kubectl --context docker-desktop create namespace airweave
#   kubectl --context docker-desktop -n airweave create secret generic cloudflared-credentials \
#     --from-file=credentials.json="$HOME/.cloudflared/<UUID>.json"
#
# Or copy this template (tunnel-credentials.yaml is gitignored), paste the JSON
# and let up.sh apply it:
#   cp tunnel-credentials.example.yaml tunnel-credentials.yaml
#
# Never commit real credentials. up.sh refuses to apply a copy that still
# contains the REPLACE_WITH_ placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-credentials
  namespace: airweave
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/part-of: airweave
type: Opaque
stringData:
  credentials.json: |
    {
      "AccountTag": "REPLACE_WITH_ACCOUNT_TAG",
      "TunnelSecret": "REPLACE_WITH_TUNNEL_SECRET",
      "TunnelID": "00000000-0000-0000-0000-000000000000"
    }
